version: '3.8'

services:
  sogs:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sogs-app
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=Snowflake Optimizer & Governance Suite (SOGS)
      - APP_VERSION=1.0.0
      - DEBUG=true
      - HOST=0.0.0.0
      - PORT=8000
    volumes:
      # Mount local directory for development (optional)
      - ./templates:/app/templates
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - sogs-network

networks:
  sogs-network:
    driver: bridge
